name: Control Plane Verification

on:
  push:
    branches: [manus/control-plane-foundation]
  pull_request:
    paths:
      - 'apps/control-plane/**'
      - 'contracts/control-plane.openapi.yaml'
      - 'schemas/platform-event-envelope.schema.json'
      - '.github/workflows/control-plane.yml'

jobs:
  laravel-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora_control_plane_test
          POSTGRES_USER: nexora_control
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_control -d nexora_control_plane_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, xml, zip, bcmath
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          cat > .env.testing <<'EOF'
          APP_ENV=testing
          APP_KEY=base64:r6BmD0XQj92oRZ2m1xDkwC3uQk0rBFiDRpDH2VJmFB4=
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=nexora_control_plane_test
          DB_USERNAME=nexora_control
          DB_PASSWORD=${{ github.run_id }}
          DB_SEARCH_PATH=control_plane,public
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          EOF
          PGPASSWORD=${{ github.run_id }} psql -h 127.0.0.1 -U nexora_control -d nexora_control_plane_test -c 'CREATE SCHEMA IF NOT EXISTS control_plane;'
          php artisan migrate --env=testing --force
      - name: PHP syntax and style
        run: |
          find app tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
          ./vendor/bin/pint --test
      - name: PostgreSQL integration and contract tests
        run: ./vendor/bin/phpunit
      - name: Portable schema syntax
        run: python3 -m json.tool ../../schemas/platform-event-envelope.schema.json > /dev/null
      - name: Dependency audit
        run: composer audit
