[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-vpe"
version = "0.1.0"
description = "Headless, formative-learning S0 runtime for Nexora VPE"
requires-python = ">=3.11"
license = { text = "Proprietary - pending license review" }
authors = [{ name = "Manus AI" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
